services:
  clickraids:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      STATE_DIR: ${STATE_DIR:-/data}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    volumes:
      - data:${STATE_DIR:-/data}
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: '4'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${BACKEND_PORT:-8000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  data:
