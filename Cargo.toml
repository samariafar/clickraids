[package]
name = "clickraids"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "clickraids"
path = "src/server/main.rs"

[dependencies]
axum = { version = "0.7.6", features = ["ws"] }
env_logger = "0.11.5"
futures-util = "0.3.30"
include_dir = "0.7.4"
log = "0.4.22"
mimalloc = "0.1.43"
tokio = { version = "1.40.0", features = ["full"] }
tower-http = { version = "0.5.2", features = ["fs"] }
zstd = "0.13.2"
