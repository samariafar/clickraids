# fly.toml app configuration file generated for clickraids on 2026-10-18T00:05:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clickraids'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    SITE_URL = 'https://clickraids.com'

[[mounts]]
  source = 'clickraids_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
